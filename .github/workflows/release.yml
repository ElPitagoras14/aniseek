name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/elpitagoras14/aniseek

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compare.outputs.version }}
      previous: ${{ steps.compare.outputs.previous }}
      should-release: ${{ steps.compare.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Baseline = el tag semver más alto, no el commit anterior: si una
      # corrida falla después de publicar imágenes pero antes de crear el
      # tag, la corrida siguiente vuelve a ver los mismos cambios pendientes.
      - id: compare
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          PREVIOUS=$(git tag --sort=-v:refname | head -1)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

          if [ -z "$PREVIOUS" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # sort -V compara por precedencia numérica, no alfabética: 2.0.9
          # queda por debajo de 2.0.10. git describe --tags --abbrev=0, que
          # este pipeline evita a propósito, no ofrece esa garantía.
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$PREVIOUS" | sort -V | tail -1)
          if [ "$HIGHEST" = "$VERSION" ] && [ "$VERSION" != "$PREVIOUS" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dir: backend
          - image: worker
            dir: worker
          - image: web
            dir: frontend
          - image: migrate
            dir: dbmate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye si el servicio cambió desde el baseline, o si no hay una
      # imagen previa de la que reutilizar (servicio nuevo, registro
      # purgado). Si no, reutiliza: copia de manifiesto para
      # api/worker/migrate, estampado de versión para web.
      - id: decide
        run: |
          PREVIOUS="${{ needs.detect.outputs.previous }}"
          IMAGE="${{ env.IMAGE_PREFIX }}-${{ matrix.image }}"

          if [ -z "$PREVIOUS" ] || ! git diff --quiet "$PREVIOUS"..HEAD -- ${{ matrix.dir }}; then
            echo "action=build" >> "$GITHUB_OUTPUT"
          elif ! docker buildx imagetools inspect "$IMAGE:$PREVIOUS" > /dev/null 2>&1; then
            echo "action=build" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.image }}" = "web" ]; then
            echo "action=stamp" >> "$GITHUB_OUTPUT"
          else
            echo "action=promote" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.decide.outputs.action == 'build'
        uses: docker/build-push-action@v6
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          provenance: false
          sbom: false
          context: ./${{ matrix.dir }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.detect.outputs.version }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.detect.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote manifest
        if: steps.decide.outputs.action == 'promote'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.detect.outputs.version }} \
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.detect.outputs.previous }}

      - name: Write promotion Dockerfile
        if: steps.decide.outputs.action == 'stamp'
        run: |
          printf '%s' "${{ needs.detect.outputs.version }}" > app-version
          cat > Dockerfile.promote <<EOF
          FROM ${{ env.IMAGE_PREFIX }}-web:${{ needs.detect.outputs.previous }}
          COPY app-version /app-version
          EOF

      # Sin RUN: es ensamblado de capas, no reconstrucción. Por eso no
      # necesita emulación QEMU para arm64 pese a construir multi-arch.
      - name: Push stamped image
        if: steps.decide.outputs.action == 'stamp'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.promote
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ needs.detect.outputs.version }}

  promote-latest:
    needs: [detect, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un solo runner en bucle: cada llamada tarda segundos, levantar cuatro
      # runners para esto sería desproporcionado. Corre después de que las
      # cuatro legs publicaron su tag de versión, para que compose.yaml
      # —que referencia :latest en los cuatro— nunca vea una mezcla.
      - name: Move :latest
        run: |
          for image in api worker web migrate; do
            docker buildx imagetools create \
              --tag ${{ env.IMAGE_PREFIX }}-$image:latest \
              ${{ env.IMAGE_PREFIX }}-$image:${{ needs.detect.outputs.version }}
          done

  release:
    needs: [detect, promote-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [detect, release]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dokploy
        id: dokploy
        continue-on-error: true
        run: |
          curl -X 'POST' \
            'https://dokploy.pitagoraslab.qzz.io/api/compose.deploy' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
            -d '{
              "composeId": "${{ vars.DOKPLOY_COMPOSE_ID }}",
              "title": "Deployment v${{ needs.detect.outputs.version }}",
              "description": "Automatic deployment from GitHub Actions"
            }'

      - name: Deploy to Dokploy status check
        if: always()
        run: |
          echo "Dokploy deployment completed"
